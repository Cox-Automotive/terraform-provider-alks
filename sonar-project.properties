# must be unique in a given SonarQube instance
sonar.projectKey=ghes:ETS-CloudAutomation_terraform-provider-alks:terraform-provider-alks
sonar.go.coverage.reportPaths=coverage.out

sonar.exclusions=**/*_test.go,vendor/**
sonar.test.inclusions=**/*_test.go

# Coverage exclusions — each entry requires context that cannot be replicated
# in unit tests without live infrastructure:
#
#   resource_alks_iamrole.go, resource_alks_iamtrustrole.go,
#   resource_alks_ltk.go, data_source_alks_keys.go, helpers.go, main.go
#     → require live ALKS/AWS credentials; tested via TF_ACC acceptance tests only
#
#   config.go
#     → provider schema wiring that requires a real *schema.ResourceData context
#
#   iam_tags.go
#     → SetTagsDiff requires *schema.ResourceDiff and *AlksClient at runtime;
#       splitting it into a separate file for isolated exclusion is future work
sonar.coverage.exclusions=config.go,helpers.go,resource_alks_iamrole.go,resource_alks_iamtrustrole.go,resource_alks_ltk.go,data_source_alks_keys.go,main.go,iam_tags.go
