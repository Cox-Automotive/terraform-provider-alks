# must be unique in a given SonarQube instance
sonar.projectKey=ghes:ETS-CloudAutomation_terraform-provider-alks:terraform-provider-alks
sonar.go.coverage.reportPaths=coverage.out

sonar.exclusions=**/*_test.go,vendor/**
sonar.test.inclusions=**/*_test.go

# The following files require live ALKS/AWS credentials tested via TF_ACC acceptance tests,
# or live Terraform ResourceDiff/AlksClient context that cannot be unit-tested.
# Coverage is measured on the pure utility and provider configuration files only.
sonar.coverage.exclusions=config.go,helpers.go,resource_alks_iamrole.go,resource_alks_iamtrustrole.go,resource_alks_ltk.go,data_source_alks_keys.go,main.go,iam_tags.go
