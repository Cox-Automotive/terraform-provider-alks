name: Check For Release Label

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check_for_release_label:
    runs-on: cai-standard-x86-linux
    steps:
      - name: Check for release label
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LABELS=$(curl -sf -H "Authorization: token ${TOKEN}" \
            "https://ghe.coxautoinc.com/api/v3/repos/${REPO}/issues/${PR_NUMBER}/labels" \
            | jq -r '[.[].name] | join(",")') \
            || { echo "::error::Failed to fetch labels from the GHE API"; exit 1; }
          echo "Labels: ${LABELS}"
          if echo "${LABELS}" | grep -qE '(^|,)release/(skip|patch|minor|major)(,|$)'; then
            echo "Release label found — OK"
          else
            echo "Please label your PR with a release label (release/patch, release/minor, release/major, or release/skip)"
            exit 1
          fi
