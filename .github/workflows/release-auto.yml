name: ALKS TFP Release

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  get_pull_request:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: cai-standard-x86-linux
    steps:
      - name: Extract PR metadata from event payload
        id: get-merged-pull-request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "labels=${{ join(github.event.pull_request.labels.*.name, ',') }}" >> $GITHUB_OUTPUT
          echo "title=${PR_TITLE}" >> $GITHUB_OUTPUT
    outputs:
      pull_request_labels: ${{ steps.get-merged-pull-request.outputs.labels }}
      pull_request_title: ${{ steps.get-merged-pull-request.outputs.title }}

  release:
    runs-on: cai-standard-x86-linux
    needs: get_pull_request
    if: ${{ contains(needs.get_pull_request.outputs.pull_request_labels, 'release/patch') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/minor') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/major') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets._GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Get the release level from labels
        uses: actions-ecosystem/action-release-label@955bf130fba6be3d99d2c14457d0dc7f176bc563
        id: release-label
        with:
          labels: ${{ needs.get_pull_request.outputs.pull_request_labels }}

      - name: Get latest tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@8656db79964f6757c940965c172d371ceedc8a7f
        with:
          fallback: v0.0.0

      - name: Bump semver
        uses: actions-ecosystem/action-bump-semver@v1
        id: bump-semver
        with:
          current_version: ${{ steps.previoustag.outputs.tag }}
          level: ${{ steps.release-label.outputs.level }}

      - name: Push new tag to GHE
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ needs.get_pull_request.outputs.pull_request_title }}
        run: |
          git tag "$NEW_TAG" -m "$NEW_TAG: PR #${PR_NUMBER} ${PR_TITLE}"
          git push "https://x-access-token:${{ secrets._GITHUB_TOKEN }}@ghe.coxautoinc.com/${{ github.repository }}.git" "$NEW_TAG"

      - name: Mirror master + new tag to github.com
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
        run: |
          git push "https://x-access-token:${{ secrets.GH_COM_TOKEN }}@github.com/Cox-Automotive/terraform-provider-alks.git" master
          git push "https://x-access-token:${{ secrets.GH_COM_TOKEN }}@github.com/Cox-Automotive/terraform-provider-alks.git" "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GH_COM_TOKEN }}
          GITHUB_SERVER_URL: https://github.com
          GITHUB_API_URL: https://api.github.com
