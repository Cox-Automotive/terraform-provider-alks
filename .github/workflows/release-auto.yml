name: ALKS TFP Release

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  get_pull_request:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: cai-standard-x86-linux
    steps:
      - name: Extract PR metadata from event payload
        id: get-merged-pull-request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "labels=${PR_LABELS}" >> $GITHUB_OUTPUT
          echo "title=${PR_TITLE}" >> $GITHUB_OUTPUT
    outputs:
      pull_request_labels: ${{ steps.get-merged-pull-request.outputs.labels }}
      pull_request_title: ${{ steps.get-merged-pull-request.outputs.title }}

  release:
    runs-on: cai-standard-x86-linux
    needs: get_pull_request
    if: ${{ contains(needs.get_pull_request.outputs.pull_request_labels, 'release/patch') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/minor') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/major') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          token: ${{ secrets._GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Get the release level from labels
        uses: actions-ecosystem/action-release-label@955bf130fba6be3d99d2c14457d0dc7f176bc563
        id: release-label
        with:
          labels: ${{ needs.get_pull_request.outputs.pull_request_labels }}

      - name: Get latest tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@8656db79964f6757c940965c172d371ceedc8a7f
        with:
          fallback: v0.0.0

      - name: Bump semver
        id: bump-semver
        env:
          CURRENT_TAG: ${{ steps.previoustag.outputs.tag }}
          LEVEL: ${{ steps.release-label.outputs.level }}
        run: |
          VERSION="${CURRENT_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$LEVEL" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "new_version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Create release tag
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ needs.get_pull_request.outputs.pull_request_title }}
        run: |
          git tag "$NEW_TAG" -m "$NEW_TAG: PR #${PR_NUMBER} ${PR_TITLE}"

      - name: Mirror master to github.com
        env:
          GHCOM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
        run: |
          git push "https://x-access-token:${GHCOM_TOKEN}@github.com/Cox-Automotive/terraform-provider-alks.git" HEAD:refs/heads/master

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye 2>/dev/null || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT=$(gpg --with-colons --fingerprint --list-secret-keys 2>/dev/null \
            | awk -F: '/^fpr:/ {print $10; exit}')
          echo "fingerprint=${FINGERPRINT}" >> $GITHUB_OUTPUT
          KEYGRIPS=$(gpg --list-secret-keys --with-keygrip --keyid-format LONG 2>/dev/null \
            | grep 'Keygrip' | awk '{print $3}')
          PASS_HEX=$(printf '%s' "$PASSPHRASE" | od -An -tx1 | tr -d ' \n')
          for KEYGRIP in $KEYGRIPS; do
            gpg-connect-agent "PRESET_PASSPHRASE ${KEYGRIP} -1 ${PASS_HEX}" /bye
          done

      - name: Run GoReleaser
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GH_COM_TOKEN }}
          GITHUB_SERVER_URL: https://github.com
          GITHUB_API_URL: https://api.github.com
        run: |
          cd /tmp
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/goreleaser/goreleaser/releases/download/v2.3.2/goreleaser_Linux_x86_64.tar.gz" \
            -o goreleaser_Linux_x86_64.tar.gz
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/goreleaser/goreleaser/releases/download/v2.3.2/checksums.txt" \
            -o goreleaser_checksums.txt
          grep 'goreleaser_Linux_x86_64.tar.gz$' goreleaser_checksums.txt | sha256sum -c
          tar xzf goreleaser_Linux_x86_64.tar.gz -C /usr/local/bin goreleaser
          goreleaser release --clean

      - name: Push release tag to GHE
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
          GHE_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git push "https://x-access-token:${GHE_TOKEN}@ghe.coxautoinc.com/${GH_REPO}.git" "$NEW_TAG"
