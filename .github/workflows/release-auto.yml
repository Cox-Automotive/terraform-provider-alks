name: ALKS TFP Release

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  get_pull_request:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: cai-standard-x86-linux
    steps:
      - name: Extract PR metadata from event payload
        id: get-merged-pull-request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "labels=${{ join(github.event.pull_request.labels.*.name, ',') }}" >> $GITHUB_OUTPUT
          echo "title=${PR_TITLE}" >> $GITHUB_OUTPUT
    outputs:
      pull_request_labels: ${{ steps.get-merged-pull-request.outputs.labels }}
      pull_request_title: ${{ steps.get-merged-pull-request.outputs.title }}

  release:
    runs-on: cai-standard-x86-linux
    needs: get_pull_request
    if: ${{ contains(needs.get_pull_request.outputs.pull_request_labels, 'release/patch') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/minor') || contains(needs.get_pull_request.outputs.pull_request_labels, 'release/major') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets._GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Get the release level from labels
        uses: actions-ecosystem/action-release-label@955bf130fba6be3d99d2c14457d0dc7f176bc563
        id: release-label
        with:
          labels: ${{ needs.get_pull_request.outputs.pull_request_labels }}

      - name: Get latest tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@8656db79964f6757c940965c172d371ceedc8a7f
        with:
          fallback: v0.0.0

      - name: Bump semver
        uses: actions-ecosystem/action-bump-semver@34e334551143a5301f38c830e44a22273c6ff5c5 # v1
        id: bump-semver
        with:
          current_version: ${{ steps.previoustag.outputs.tag }}
          level: ${{ steps.release-label.outputs.level }}

      - name: Push new tag to GHE
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ needs.get_pull_request.outputs.pull_request_title }}
          GHE_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git tag "$NEW_TAG" -m "$NEW_TAG: PR #${PR_NUMBER} ${PR_TITLE}"
          git push "https://x-access-token:${GHE_TOKEN}@ghe.coxautoinc.com/${GH_REPO}.git" "$NEW_TAG"

      - name: Mirror master + new tag to github.com
        env:
          NEW_TAG: ${{ steps.bump-semver.outputs.new_version }}
          GHCOM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
        run: |
          git push "https://x-access-token:${GHCOM_TOKEN}@github.com/Cox-Automotive/terraform-provider-alks.git" master
          git push "https://x-access-token:${GHCOM_TOKEN}@github.com/Cox-Automotive/terraform-provider-alks.git" "$NEW_TAG"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GH_COM_TOKEN }}
          GITHUB_SERVER_URL: https://github.com
          GITHUB_API_URL: https://api.github.com
